[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-feature-pipeline"
version = "0.3.0"
description = "企业征信风险特征分析流水线（IV / LR / 规则挖掘 / 客户级触碰扫描 / Word 报告）"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "JialuXu" },
]
license = { text = "Internal" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Financial and Insurance Industry",
]

# 核心依赖：管线运行 + 数据处理
# 数值/ML 库加主版本上界，避免 pip 自动拉到引入破坏性变更的下一个大版本
# （如 sklearn 跨小版本移除 LogisticRegression 的 penalty 参数）。
dependencies = [
    "pandas>=1.5,<4",
    "numpy>=1.23,<3",
    "scikit-learn>=1.1,<2",
    "scipy>=1.9,<2",
    "pyyaml>=6.0",
    "optbinning>=0.19,<2",
    "joblib>=1.1",       # rule_extraction 直接 import（dump 决策树模型），不只靠 sklearn 间接带
]

[project.optional-dependencies]
# 可视化子 Skill（risk_visualization）
viz = [
    "matplotlib>=3.6",
    "seaborn>=0.12",
]
# 决策树规则挖掘的可视化（plot_tree 在 sklearn 自带；如需 graphviz 渲染则装下面）
tree = [
    "graphviz>=0.20",
]
# 开发依赖
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]
# 一次装满
all = [
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "graphviz>=0.20",
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.0",
    "ruff>=0.5",
]

[project.scripts]
risk-pipeline = "risk_mining.cli:main"

[tool.setuptools.packages.find]
include = [
    "risk_core*",
    "risk_mining*",
    "risk_legacy_chains*",
    "risk_pipeline*",
    "shared*",
    "risk_data_prep*",
    "risk_feature_engineering*",
    "risk_segment_univariate*",
    "risk_iv_diagnosis*",
    "risk_logistic_regression*",
    "risk_rule_mining*",
    "risk_export_report*",
    "risk_result_query*",
    "risk_trigger_extraction*",
    "risk_docx_report*",
    "risk_visualization*",
    "risk_threshold_explore*",
]
exclude = [
    "tests*",
    "data*",
    "output*",
    "skills*",
]

# 非 .py 资产随 wheel 分发：默认阈值 + 列映射模板（config/ 已并入 risk_core/）。
# setuptools 的 packages.find 只装包内 .py，故这里显式声明 package-data。
[tool.setuptools.package-data]
risk_core = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

# ---------------------------------------------------------------------------
# ruff：只开「真错误」类规则（语法错误 + pyflakes），CI 与本地一致：
#   ruff check .
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# 包入口与兼容 shim：import 即再导出
"**/__init__.py" = ["F401"]
"risk_pipeline/**" = ["F401"]
"shared/**" = ["F401"]
# 子 skill 的 scripts/config.py 是公共配置聚合点（import * + 再导出）
"**/scripts/config.py" = ["F401", "F403", "F405"]
# 内核两模块经 risk_iv_diagnosis 的 `import *` 整体再导出，顶层导入的配置名属公开面
"risk_mining/analysis/engine.py" = ["F401"]
"risk_mining/analysis/iv_core.py" = ["F401"]
