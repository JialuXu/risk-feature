# =============================================================================
# 风险特征分析 - 默认配置文件
# =============================================================================
# 使用方式：
#   1. 直接修改本文件中的值
#   2. 或复制为新文件（如 my_bank.yaml），仅覆盖需要修改的部分
#      未覆盖的部分自动使用本文件中的默认值
# =============================================================================

# ---- 项目信息 ----
project:
  name: "风险特征分析"
  description: "企业信贷风险特征挖掘"

# ---- 数据路径（相对于项目根目录） ----
data:
  raw:
    customer_info: "data/raw/客户信息.csv"       # 客户基本信息
    business_change: "data/raw/工商变更_特征.csv" # 工商变更特征
    bad_label: "data/raw/坏客户标记.csv"          # 坏客户标记
    credit_report: "data/raw/征信数据.csv"        # 征信数据
  processed:
    financial: "data/processed/财务数据_处理后.csv"  # 财务数据
    industry: "data/processed/产业数据_处理后.csv"   # 产业数据

# ---- 输出路径 ----
output:
  results: "data/results/"           # 分析结果中间目录
  results_gsfc: "data/results/工商财务"  # 工商财务分析结果
  results_credit: "data/results/征信"    # 征信分析结果
  final: "output/"                   # 最终输出目录
  final_gsfc: "output/工商财务"         # 工商财务最终输出
  final_credit: "output/征信"           # 征信最终输出

# ---- 样本量阈值 ----
thresholds:
  min_samples: 50            # 分群总样本数下限
  min_bad_samples: 10        # IV计算坏客户数下限
  min_bad_corr: 15           # 相关系数/T检验坏客户数下限
  min_good_corr: 30          # 相关系数/T检验好客户数下限
  min_bad_lr: 20             # 逻辑回归建模坏客户数下限
  min_good_lr: 50            # 逻辑回归建模好客户数下限
  min_samples_cv: 200        # 交叉验证AUC总样本下限
  min_bad_cv: 30             # 交叉验证AUC坏客户下限

# ---- IV 配置 ----
iv:
  suspect_threshold: 2.0     # IV 可疑阈值（超过视为疑似数据穿越）
  woe_cap: 5.0               # WOE 截断绝对值上限
  select_threshold: 0.1      # IV 筛选阈值（中等预测性以上）
  prediction_overstrong_min: 0.5  # 全量 IV「过强」分档起点（高于强预测能力，需复核）
  adaptive_bins:
    sample_threshold: 300    # 触发自适应分箱的总样本阈值
    bad_threshold: 30        # 触发自适应分箱的坏客户阈值
    min_bins: 3              # 自适应分箱最小值
  prediction_levels:
    weak: 0.02               # 弱预测能力下限
    medium: 0.1              # 中等预测能力下限
    strong: 0.3              # 强预测能力下限
  credibility:               # IV 可信度分级阈值（_assess_iv_reliability 使用）
    min_bad_strict: 20            # 坏客户数低于此值 → 走“样本不足”判定分支
    unreliable_iv_if_low_bad: 0.5 # 低坏客户数下，IV 超此值判“不可信-样本不足”
    low_sample_n: 200             # 有效样本低于此值 → 一律降级“参考”
    reference_iv: 1.0             # IV 超此值（但 ≤ suspect_threshold）→ “参考”

# ---- 授信分层配置（单位：元） ----
credit_bins:
  thresholds: [0, 10000000, 200000000]   # 1000万, 2亿（np.inf 由代码自动追加）
  labels: ["1000万以下", "1000万-2亿(腰部)", "2亿以上"]

# ---- 腰部企业定义 ----
waist:
  min: 10000000              # 1000万
  max: 200000000             # 2亿
  high_ratings: ["A-", "A", "A+", "AA-", "AA"]

# ---- 分群维度配置 ----
segment_dims:
  industry: "所属行业"
  nature: "客户性质"
  holding_type: "控股类型"
  branch: "所属分行"

# ---- 分维度分析配置 ----
dimension_config:
  business_change:
    data_key: "工商变更"
    description: "企业工商登记变更行为特征"
    exclude_cols: ["客户编号", "最近变更日期"]
  financial:
    data_key: "财务数据"
    description: "企业财务报表指标及衍生比率"
    exclude_patterns: ["客户编号", "客户名称", "_来源"]

# ---- 规则挖掘配置（risk_rule_mining） ----
# 决策树规则挖掘：产出可读规则（非模型），用于预警策略/审批规则设计
rule_mining:
  max_depth: 3               # 树最大深度（限制规则可读性，>4基本不可解释）
  min_samples_leaf_ratio: 0.05  # 叶子最小样本占比（相对于分群总样本）
  min_bad_in_leaf: 5         # 叶子最少坏客户数（过小则规则不稳）
  min_coverage: 0.01         # 规则最小覆盖率（<1% 视为边缘规则）
  min_lift: 1.5              # 规则最小 Lift（坏账率 / 整体坏账率）
  top_k_per_segment: 10      # 每个分群保留 Top-K 条规则
  cv_splits: 5               # 稳定性交叉验证折数
  stability_min_folds: 3     # 规则被视为"稳定"的最少出现折数
  tree_criterion: "gini"     # 分裂准则：gini / entropy
  class_weight: "balanced"   # 样本不平衡处理（坏客户占比低时必须）
