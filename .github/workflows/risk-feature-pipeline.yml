name: risk-feature-pipeline

on:
  push:
    branches: [main]
    paths: ["risk-feature-pipeline/**", ".github/workflows/risk-feature-pipeline.yml"]
  pull_request:
    paths: ["risk-feature-pipeline/**", ".github/workflows/risk-feature-pipeline.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: risk-feature-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: risk-feature-pipeline/pyproject.toml
      - name: 安装依赖
        run: python -m pip install -e ".[viz,dev]"
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python -m pytest -q
