# =============================================================================
# 字段映射配置
# =============================================================================
# 说明：将通用字段名映射到本行实际字段名
# 使用方式：
#   - 默认值对应当前行的字段名
#   - 只需在自己的配置文件中覆盖不同的字段名
#   - 示例：某行的客户编号叫 "CUST_NO"，只需设置 required.customer_id: "CUST_NO"
# =============================================================================

# ---- 必填字段 ----
required:
  customer_id: "客户编号"          # 主键，其他行可能叫 "CUST_NO" / "客户ID"
  target: "is_bad"                 # 目标变量（0/1），其他行可能叫 "是否违约" / "DEFAULT_FLAG"
  report_date: "报告日期"          # 报告日期字段名

# ---- 分群维度字段（类别型） ----
segment_dims:
  industry: "所属行业"             # 行业分类
  branch: "所属分行"               # 机构
  nature: "客户性质"               # 企业性质
  holding_type: "控股类型"         # 控股类型
  scale: "企业规模"                # 企业规模

# ---- 征信分析的分群维度（更多维度，含产业数据字段） ----
credit_category_dims:
  - "所属分行"
  - "客户性质"
  - "企业规模"
  - "控股类型"
  - "所属行业"
  - "客户分层"
  - "产业大类"
  - "所属阶段"

# ---- 二值标签列（资质标签） ----
qualification:
  prefix: "是_"                    # 二值标签列的前缀，如 "是_高新技术企业"
  # 或者显式列出（取消注释后 prefix 将被忽略）：
  # columns:
  #   - "是_高新技术企业"
  #   - "是_专精特新"

# ---- 金额字段（用于清洗千分位） ----
amount_cols:
  - "授信总金额"
  - "表内授信余额"
  - "表外授信余额"
  - "类信贷余额"

# ---- 千分位修复时跳过的列（非数值型的分类/主键列） ----
numeric_skip_cols:
  - "客户编号"
  - "客户编号_str"
  - "报告日期"
  - "所属分行"
  - "客户性质"
  - "企业规模"
  - "控股类型"
  - "所属行业"
  - "行业大类"
  - "行业小类"
  - "客户分层"
  - "细分赛道"
  - "产业大类"
  - "所属阶段"
  - "赛道"

# ---- 日期字段 ----
date_cols:
  - "报告日期"
  - "最近变更日期"

# ---- 宽表合并时财务侧重复列（避免 merge 产生 _x/_y） ----
finance_merge_dup_cols:
  - "所属分行"
  - "客户性质"
  - "企业规模"
  - "控股类型"
  - "所属行业"
  - "行业大类"
  - "行业小类"
  - "授信总金额"
  - "表内授信余额"
  - "客户分层"
  - "细分赛道"
  - "产业大类"
  - "所属阶段"
  - "是否科技企业"
  - "赛道"
  - "是否坏客户"

# ---- 产业属性数据列 ----
industry_data_cols:
  - "客户分层"
  - "细分赛道"
  - "产业大类"
  - "所属阶段"
  - "赛道"

# ---- 分群IV分析时的唯一值上限（防止维度值过多导致计算量爆炸） ----
segment_iv_limits:
  industry: 15
  nature: 10
  holding_type: null               # null 表示不限制
  branch: 20
  scale: null                      # null 表示不限制

# ---- 征信原始特征 ----
credit_raw_features:
  - "担保人征信查询次数"
  - "总机构数"
  - "信贷交易未结清总机构数"
  - "非银授信机构数"
  - "银行授信机构数"
  - "当前逾期机构数"
  - "当前逾期余额"
  - "小额贷款公司数"
  - "消费金融公司数"

# ---- 征信衍生特征 ----
credit_derived_features:
  # 占比/比率类（第一轮）
  - "非银机构占比"
  - "银行机构占比"
  - "小贷公司占比"
  - "消金公司占比"
  - "未结清机构占比"
  - "高风险渠道占比"
  - "非银银行比例"
  - "担保查询机构比"
  - "担保查询未结清比"
  # 结构/行为类（第一轮）
  - "高风险渠道数"
  - "是否有高风险渠道"
  - "授信分散度"
  - "高风险未结清交叉"
  # 补充衍生列（第二轮：针对征信数据特性）
  - "结清机构占比"
  - "当前逾期率"
  - "人均担保查询"
  - "人均未结清笔数"
  - "逾期每机构余额"
  - "纯非银比例"
  - "审核压力比"
  - "高风险渠道总数"
  - "高风险渠道占总比"
  - "渠道多样性"
  - "log_总机构数"
  - "log_未结清机构数"
